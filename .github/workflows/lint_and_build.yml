---
name: lint_and_build
on:  # yamllint disable-line rule:truthy
  push:
    branches-ignore:
      - production

jobs:
  lint_el10:
    uses: ./.github/workflows/lint.yml
    with:
      codename: el10
      docker_image_name: ghcr.io/almalinux/10-base
      docker_image_tag: "10"

  build_el9:
    needs:
      - lint_el10
    uses: ./.github/workflows/build.yml
    with:
      codename: el9
      docker_image_name: ghcr.io/almalinux/9-base
      docker_image_tag: "9"

  build_el10:
    needs:
      - lint_el10
    uses: ./.github/workflows/build.yml
    with:
      codename: el10
      docker_image_name: ghcr.io/almalinux/10-base
      docker_image_tag: "10"
