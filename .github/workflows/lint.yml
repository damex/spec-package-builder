---
name: lint
on:  # yamllint disable-line rule:truthy
  workflow_call:
    inputs:
      codename:
        required: true
        type: string
      docker_image_name:
        required: true
        type: string
      docker_image_tag:
        required: true
        type: string

jobs:
  list_spec_files:
    runs-on: ubuntu-24.04
    outputs:
      spec_files: ${{ steps.list_spec_files.outputs.spec_files }}
    steps:
      - uses: actions/checkout@v4
      - id: list_spec_files
        run: |
          spec_files=$(find SPECS/${{ inputs.codename }} -type l -name '*.spec' -printf '%f\n' | jq -R . | jq -c -s .)
          echo "spec_files=$spec_files" >> $GITHUB_OUTPUT

  lint:
    needs:
      - list_spec_files
    strategy:
      matrix:
        spec_file: ${{ fromJson(needs.list_spec_files.outputs.spec_files) }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo make SPEC_FILE=SPECS/${{ matrix.spec_file }} DOCKER_IMAGE_NAME=${{ inputs.docker_image_name }} DOCKER_IMAGE_TAG=${{ inputs.docker_image_tag }} lint_in_docker
