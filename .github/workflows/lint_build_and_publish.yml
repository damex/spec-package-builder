---
name: lint_build_and_publish
on:  # yamllint disable-line rule:truthy
  push:
    branches:
      - production

jobs:
  list_spec_files:
    runs-on: ubuntu-24.04
    outputs:
      spec_files: ${{ steps.list_spec_files.outputs.spec_files }}
    steps:
      - uses: actions/checkout@v4
      - id: list_spec_files
        run: |
          spec_files=$(find SPECS -type f -name '*.spec' ! -name '*.common.spec' -printf  '%f\n' | jq -R . | jq -c -s .)
          echo "spec_files=$spec_files" >> $GITHUB_OUTPUT

  lint:
    needs:
      - list_spec_files
    strategy:
      matrix:
        spec_file: ${{ fromJson(needs.list_spec_files.outputs.spec_files) }}
        docker_image:
          - name: ghcr.io/almalinux/9-base
            tag: 9
          - name: ghcr.io/almalinux/10-base
            tag: 10
        runner_image:
          - ubuntu-24.04
          - ubuntu-24.04-arm
    runs-on: ${{ matrix.runner_image }}
    steps:
      - uses: actions/checkout@v4
      - run: sudo make SPEC_FILE=SPECS/${{ matrix.spec_file }} DOCKER_IMAGE_NAME=${{ matrix.docker_image.name }} DOCKER_IMAGE_TAG=${{ matrix.docker_image.tag }} lint_in_docker

  build:
    needs:
      - list_spec_files
      - lint
    strategy:
      matrix:
        spec_file: ${{ fromJson(needs.list_spec_files.outputs.spec_files) }}
        docker_image:
          - name: ghcr.io/almalinux/9-base
            tag: 9
          - name: ghcr.io/almalinux/10-base
            tag: 10
        runner_image:
          - ubuntu-24.04
          - ubuntu-24.04-arm
    runs-on: ${{ matrix.runner_image }}
    steps:
      - uses: actions/checkout@v4
      - run: sudo make SPEC_FILE=SPECS/${{ matrix.spec_file }} DOCKER_IMAGE_NAME=${{ matrix.docker_image.name }} DOCKER_IMAGE_TAG=${{ matrix.docker_image.tag }} GPG_PRIVATE_KEY="${{ secrets.GPG_PRIVATE_KEY }}" GPG_PASSPHRASE=${{ secrets.GPG_PASSPHRASE }} build_and_sign_in_docker
      - uses: actions/upload-artifact@v4
        with:
          name: kubernetes-rpms-${{ matrix.spec_file }}-${{ matrix.docker_image.tag }}
          path: RPMS/kubernetes
      - uses: actions/upload-artifact@v4
        with:
          name: prometheus-rpms-${{ matrix.spec_file }}-${{ matrix.docker_image.tag }}
          path: RPMS/prometheus

  publish:
    needs:
      - build
    strategy:
      matrix:
        repository:
          - kubernetes
          - prometheus
        docker_image:
          - name: ghcr.io/almalinux/9-base
            tag: 9
          - name: ghcr.io/almalinux/10-base
            tag: 10
        runner_image:
          - ubuntu-24.04
          - ubuntu-24.04-arm
    runs-on: ${{ matrix.runner_image }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: ${{ matrix.repository }}-rpms-*-${{ matrix.docker_image.tag }}
          merge-multiple: true
          path: RPMS/${{ matrix.repository }}
      - run: make SPEC_FILE=none DOCKER_IMAGE_NAME=${{ matrix.docker_image.name }} DOCKER_IMAGE_TAG=${{ matrix.docker_image.tag }} GPG_PRIVATE_KEY="${{ secrets.GPG_PRIVATE_KEY }}" GPG_PASSPHRASE=${{ secrets.GPG_PASSPHRASE }} YUM_REPOSITORIES_ACCESS_KEY=${{ secrets.YUM_REPOSITORIES_ACCESS_KEY }} YUM_REPOSITORIES_SECRET_KEY=${{ secrets.YUM_REPOSITORIES_SECRET_KEY }} YUM_REPOSITORIES_S3_ENDPOINT=${{ secrets.YUM_REPOSITORIES_S3_ENDPOINT }} YUM_REPOSITORIES_BUCKET_NAME=${{ secrets.YUM_REPOSITORIES_BUCKET_NAME }} YUM_REPOSITORY_NAME=${{ matrix.repository }} publish_in_docker
